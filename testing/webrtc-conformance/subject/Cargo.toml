[package]
name = "webrtc-conformance-subject"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
rust-version = "1.97"
description = "Browser-cell subject: busbar's terminating datagram path (the webrtc door, the connector's datagram driver and host port) answering a browser's offer and echoing its channels and lines."

# TESTKIT, NOT PRODUCT PATH. This binary exists only so headless browsers have busbar's real
# terminating path to call: the webrtc door admitted through the root's own doors module (mounted
# by path), driven by the connector's EXISTING public
# datagram API (`datagram::DatagramFraming`, `datagram::Associations`, `udp::ReadyPort`) over one
# host port. It is not shipped, `cargo build --bin busbar` never builds it, and it adds no product
# surface.
[[bin]]
name = "webrtc-conformance-subject"
path = "src/main.rs"

[dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "87b5d5fa1042d26aa1fcfece65f036fe8ee254ec" }
busbar-transport-webrtc = { path = "../../../transport-webrtc" }
busbar-core-connector = { git = "https://github.com/GetBusbar/busbar", rev = "87b5d5fa1042d26aa1fcfece65f036fe8ee254ec" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "87b5d5fa1042d26aa1fcfece65f036fe8ee254ec" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "sync", "time"] }
