# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `busbar-release plugin heal busbar-transport-webrtc` from GetBusbar/busbar-release template/ and
# GetBusbar/busbar's dependency policy; a hand edit is overwritten by the next sync.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic (the rlib a
# busbar build links) and the thin cdylib that packages it as a droppable `kind: transport` plugin
# (crate `busbar-transport-webrtc-plugin`). Its one busbar dependency is busbar-contract (busbar-plugin-loader is dev-only,
# for the both-ways conformance test), both git dependencies on GetBusbar/busbar at the pin in
# `.busbar-ref`; no sibling-checkout path dependency ships in any manifest.
#
# THIRD-PARTY VERSIONS ARE THE FLEET'S, NOT THIS REPO'S. The table below is busbar's own root
# `[workspace.dependencies]` (third-party rows) at busbar b1a4ad0df48e7f3b24757db688a66e165255a536, followed by the plugin-only rows
# of busbar's `.github/fleet/deps.toml` at b1a4ad0df48e7f3b24757db688a66e165255a536. A member takes a crate with
# `{ workspace = true }` (adding features if it needs them); a crate in neither table is a new
# `deps.toml` row in busbar first. CI holds this repo's Cargo.lock to busbar's lock at the pin.
[workspace]
resolver = "2"
members = [
    "transport-webrtc",
    "transport-webrtc-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-transport-webrtc"

# The ONE fleet clippy allowance (coordinator ruling (a), 2026-10-19): every plugin-built ABI literal
# spreads `..Type::ZERO` (the zero-spread guard, busbar #1207), which a literal naming every field
# today trips as needless_update. Members take it with `[lints] workspace = true`.
[workspace.lints.clippy]
needless_update = "allow"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "b1a4ad0df48e7f3b24757db688a66e165255a536" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "b1a4ad0df48e7f3b24757db688a66e165255a536" }
