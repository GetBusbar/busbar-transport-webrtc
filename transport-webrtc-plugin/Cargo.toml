# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-webrtc-plugin"
version = "1.6.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:transport plugin cdylib: the webrtc transport, packaged as a droppable busbar plugin. Drop the signed tarball into plugins/."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`), exporting `busbar_plugin_door`.
# rlib: what `cargo test` links, and what makes `cargo test` emit the cdylib the conformance test
# loads (a cdylib-only package builds a trivial test harness and never produces the library).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door::door` is the door this image exports. A busbar build that LINKS
# the transport names the logic crate, which exports no symbol.
busbar-transport-webrtc = { path = "../transport-webrtc" }
busbar-contract = { workspace = true }

[dev-dependencies]
# THE BOTH-WAYS WITNESS (tests/conformance.rs): the linked door and this crate's built cdylib, each
# admitted by busbar's real loader, run one script to one transcript (Part 2 #2). Dev-only, never in
# the shipped artifact. Same pinned rev, so one busbar source resolves.
busbar-plugin-loader = { workspace = true }
busbar-test-kit = { workspace = true }
